 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}
 
#formPage{
    display:block;
}

#profilePage{
    display:none;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.view{
    background:#28a745;
}

.back{
    background:#2196f3;
}

.avatar{
    width:90px;
    height:90px;
    background:#2196f3;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    margin:15px auto;
}

h2,h3{
    text-align:center;
    margin-bottom:15px;
}

p{
    margin:10px 0;
    font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<!-- First Page -->
<div id="formPage">

<h2>🎓STUDENT PROFILE</h2>

<input type="text" id="name" placeholder="Enter Name">

<input type="text" id="roll" placeholder="Enter Roll Number">

<input type="number" id="marks" placeholder="Enter Marks">

<button class="view" onclick="showProfile()">Display Profile</button>

</div>

<!-- Second Page -->
<div id="profilePage">

<div class="avatar" id="avatar"></div>

<h3 id="sname"></h3>

<p><b>Roll No :</b> <span id="sroll"></span></p>

<p><b>Marks :</b> <span id="smarks"></span></p>

<p><b>Grade :</b> <span id="grade"></span></p>

<p><b>Status :</b> <span id="status"></span></p>

<button class="back" onclick="goBack()">Back</button>

</div>

</div>

<script>

function showProfile(){

let name=document.getElementById("name").value;
let roll=document.getElementById("roll").value;
let marks=parseInt(document.getElementById("marks").value);

if(name=="" || roll=="" || isNaN(marks)){
    alert("Please fill all fields");
    return;
}

let grade;

if( marks>=90 && marks<=100)
grade="A+";
else if(marks>=80)
grade="A";
else if(marks>=70)
grade="B+";
else if(marks>=60)
grade="B";
else if(marks>=50)
grade="C";
else
grade="F";

document.getElementById("avatar").innerHTML=name.charAt(0).toUpperCase();
document.getElementById("sname").innerHTML=name;
document.getElementById("sroll").innerHTML=roll;
document.getElementById("smarks").innerHTML=marks;
document.getElementById("grade").innerHTML=grade;
document.getElementById("status").innerHTML=(marks>=50)?"PASS":"FAIL";
document.getElementById("status").style.color=(marks>=50)?"green":"red";

/* Hide first page and show second page */
document.getElementById("formPage").style.display="none";
document.getElementById("profilePage").style.display="block";

}

function goBack(){

document.getElementById("profilePage").style.display="none";
document.getElementById("formPage").style.display="block";

}

</script>

</body>
</html>
